<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Legal Casebase — Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="data.js?v=2"></script>
  <script src="searchApi.js?v=2"></script>
  <script src="caseApi.js?v=1"></script>
  <script type="text/babel" src="tweaks-panel.jsx?v=2"></script>
  <script type="text/babel" src="components/atoms.jsx?v=2"></script>
  <script type="text/babel" src="components/Homepage.jsx?v=2"></script>
  <script type="text/babel" src="components/Results.jsx?v=2"></script>
  <script type="text/babel" src="components/CaseDetail.jsx?v=1"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "serifAccent": "source-serif",
      "density": "comfortable",
      "showScores": true,
      "snippetStyle": "plain",
      "accentHue": 255
    }/*EDITMODE-END*/;

    function parseHash() {
      const h = window.location.hash || "";
      // #/case/{id}
      const caseM = h.match(/^#\/case\/(\d+)/);
      if (caseM) {
        return { view: "case", caseId: Number(caseM[1]), q: "", mode: "hybrid" };
      }
      // #/results?q=...&mode=...
      if (h.startsWith("#/results")) {
        const qs = new URLSearchParams(h.split("?")[1] || "");
        return { view: "results", q: qs.get("q") || "", mode: qs.get("mode") || "hybrid" };
      }
      return { view: "home", q: "", mode: "hybrid" };
    }

    function App() {
      const [state, setState] = React.useState(parseHash());
      const [tweaks, setTweak] = (window.useTweaks || (() => [TWEAK_DEFAULTS, () => {}]))(TWEAK_DEFAULTS);

      React.useEffect(() => {
        const onHash = () => setState(parseHash());
        window.addEventListener("hashchange", onHash);
        // global / shortcut to focus search
        const onKey = (e) => {
          if (e.key === "/" && document.activeElement?.tagName !== "INPUT") {
            e.preventDefault();
            const i = document.querySelector(".search-shell input");
            if (i) i.focus();
          }
        };
        window.addEventListener("keydown", onKey);
        return () => {
          window.removeEventListener("hashchange", onHash);
          window.removeEventListener("keydown", onKey);
        };
      }, []);

      // apply tweaks via CSS variables
      React.useEffect(() => {
        document.documentElement.style.setProperty("--accent",
          `oklch(0.42 0.10 ${tweaks.accentHue})`);
        document.documentElement.style.setProperty("--accent-soft",
          `oklch(0.94 0.02 ${tweaks.accentHue})`);
      }, [tweaks.accentHue]);

      const [lastSearch, setLastSearch] = React.useState(null);

      const goHome = () => { window.location.hash = "#/"; };
      const goSearch = (q, mode) => {
        setLastSearch({ q, mode });
        const qs = new URLSearchParams({ q, mode });
        window.location.hash = `#/results?${qs.toString()}`;
      };
      const goCase = (caseId) => {
        if (state.view === "results") setLastSearch({ q: state.q, mode: state.mode });
        window.location.hash = `#/case/${caseId}`;
      };
      const goBackToResults = () => {
        if (lastSearch) {
          const qs = new URLSearchParams({ q: lastSearch.q, mode: lastSearch.mode });
          window.location.hash = `#/results?${qs.toString()}`;
        } else {
          goHome();
        }
      };

      return (
        <div data-density={tweaks.density} data-snippet={tweaks.snippetStyle}>
          <Topbar view={state.view} onNavigate={(v) => v === "home" ? goHome() : null} />
          {state.view === "home" && (
            <Homepage onSearch={goSearch} onOpenCase={goCase} />
          )}
          {state.view === "results" && (
            <Results
              initialQuery={state.q}
              initialMode={state.mode}
              onSearch={goSearch}
              onHome={goHome}
              onOpenCase={goCase}
              showScores={tweaks.showScores}
            />
          )}
          {state.view === "case" && (
            <CaseDetail
              caseId={state.caseId}
              onHome={goHome}
              onBackToResults={goBackToResults}
              lastSearch={lastSearch}
            />
          )}

          {/* Tweaks panel — only shows when host activates Tweaks */}
          {window.TweaksPanel && (
            <TweaksPanel title="Tweaks">
              <TweakSection title="Layout">
                <TweakRadio
                  label="Density"
                  value={tweaks.density}
                  options={[
                    { value: "compact", label: "Compact" },
                    { value: "comfortable", label: "Roomy" },
                  ]}
                  onChange={(v) => setTweak("density", v)}
                />
                <TweakRadio
                  label="Snippet style"
                  value={tweaks.snippetStyle}
                  options={[
                    { value: "rule", label: "Quote rule" },
                    { value: "plain", label: "Plain" },
                    { value: "card", label: "Card" },
                  ]}
                  onChange={(v) => setTweak("snippetStyle", v)}
                />
                <TweakToggle
                  label="Show retrieval scores"
                  value={tweaks.showScores}
                  onChange={(v) => setTweak("showScores", v)}
                />
              </TweakSection>
              <TweakSection title="Color">
                <TweakSlider
                  label="Accent hue"
                  value={tweaks.accentHue}
                  min={0} max={360} step={5}
                  onChange={(v) => setTweak("accentHue", v)}
                />
              </TweakSection>
            </TweaksPanel>
          )}
        </div>
      );
    }

    // density + snippet style hooks via CSS attribute selectors
    const styleEl = document.createElement("style");
    styleEl.textContent = `
      [data-density="compact"] .result-row { padding: 12px 24px 12px !important; }
      [data-density="compact"] .result-row p { margin-bottom: 8px !important; font-size: 13.5px !important; }
      [data-snippet="plain"] .result-row p { border-left: 0 !important; padding-left: 0 !important; }
      [data-snippet="card"] .result-row p {
        border-left: 0 !important; background: var(--paper-2); padding: 12px 14px !important;
      }
    `;
    document.head.appendChild(styleEl);

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
